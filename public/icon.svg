<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#334155" stroke-width="4" />
  
  <!-- Glowing central monogram / AI glyph -->
  <g filter="url(#glow)">
    <!-- Stylized A / Chevron -->
    <path d="M256 110 L380 370 L310 370 L256 250 L202 370 L132 370 Z" fill="url(#accent)" />
    <!-- AI Sparkle in center -->
    <path d="M256 160 Q256 220 220 220 Q256 220 256 280 Q256 220 292 220 Q256 220 256 160 Z" fill="#ffffff" />
  </g>
  
  <!-- Subtle satellite nodes -->
  <circle cx="140" cy="170" r="12" fill="#38bdf8" opacity="0.8" />
  <circle cx="372" cy="170" r="12" fill="#818cf8" opacity="0.8" />
  <circle cx="256" cy="410" r="10" fill="#06b6d4" opacity="0.8" />
</svg>
