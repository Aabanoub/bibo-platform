<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1c" />
      <stop offset="50%" stop-color="#0c1527" />
      <stop offset="100%" stop-color="#14213a" />
    </linearGradient>

    <!-- Electric Cyan-Blue Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Orbital Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#2563eb" stroke-opacity="0.25" stroke-width="3" />

  <!-- Outer Orbital Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#orbitGrad)" stroke-width="4" stroke-dasharray="14 10" />

  <!-- Satellite Nodes -->
  <circle cx="256" cy="61" r="9" fill="#06b6d4" filter="url(#softGlow)" />
  <circle cx="451" cy="256" r="7" fill="#3b82f6" filter="url(#softGlow)" />

  <!-- Center Stylized 'E' Monogram & Upward Growth Arrow -->
  <g filter="url(#softGlow)">
    <!-- Main Backing Stem of 'E' -->
    <path d="M 160 140 H 330 A 25 25 0 0 1 355 165 V 175 A 15 15 0 0 1 340 190 H 225 V 235 H 315 A 15 15 0 0 1 330 250 V 260 A 15 15 0 0 1 315 275 H 225 V 322 H 340 A 15 15 0 0 1 355 337 V 347 A 25 25 0 0 1 330 372 H 160 A 25 25 0 0 1 135 347 V 165 A 25 25 0 0 1 160 140 Z" fill="url(#primaryGrad)" />
    
    <!-- Dynamic Upward Growth Arrow -->
    <path d="M 330 190 L 375 145 M 375 145 H 345 M 375 145 V 175" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
